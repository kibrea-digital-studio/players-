<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Smart Video Player — স্মার্ট ভিডিও প্লেয়ার</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, monospace; }
    #empty-player {
      position: fixed; inset: 0; z-index: 20; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 64px 24px 24px; text-align: center;
    }
    .logo-box {
      width: 56px; height: 56px; border-radius: 16px; background: rgba(255,42,95,0.18);
      border: 1px solid rgba(255,42,95,0.45);
      display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    p.sub { font-size: 12px; color: #9ca3af; max-width: 280px; line-height: 1.5; margin-bottom: 18px; }
    .btn-primary {
      width: 100%; max-width: 280px; min-height: 46px; padding: 12px 16px; border-radius: 14px; border: none;
      background: #ff2a5f; color: #fff; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-bottom: 10px; box-shadow: 0 6px 20px rgba(255, 42, 95, 0.35);
    }
    .row-2 { width: 100%; max-width: 280px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-secondary {
      width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07);
      color: #f3f4f6; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    }
    #scan-status { margin-top: 12px; font-size: 12px; color: #38bdf8; min-height: 18px; }
    #feed {
      width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }
    #feed.lock-scroll { overflow-y: hidden; }
    .slide {
      position: relative; width: 100%; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
      background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; transition: opacity 0.25s; }
    body.fit-cover video { object-fit: cover; }
    .right-rail {
      position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 136px); z-index: 40;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: opacity 0.4s;
    }
    .right-rail.dimmed { opacity: 0.2; }
    .right-rail:hover { opacity: 1 !important; }
    .droplet-btn {
      width: 36px; height: 36px; background: none; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .water-droplet {
      position: relative; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.26);
      backdrop-filter: blur(10px) saturate(130%); -webkit-backdrop-filter: blur(10px) saturate(130%);
      box-shadow: inset 0 1.5px 2.5px rgba(255,255,255,0.45), inset 0 -2px 4px rgba(0,0,0,0.28), 0 4px 12px rgba(0,0,0,0.3);
      color: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
      font-size: 13px;
    }
    .water-droplet::before {
      content: ""; position: absolute; top: 4px; left: 7px; width: 9px; height: 4px;
      border-radius: 999px; background: rgba(255,255,255,0.52); transform: rotate(-28deg); pointer-events: none;
    }
    .droplet-btn:active .water-droplet { transform: scale(0.9); }
    .droplet-btn.active-rose .water-droplet { background: rgba(255,42,95,0.24); border-color: rgba(255,42,95,0.6); color: #ff6b90; }
    .droplet-btn.active-sky .water-droplet { background: rgba(56,189,248,0.24); border-color: rgba(56,189,248,0.6); color: #7dd3fc; }
    .droplet-btn.active-red .water-droplet { background: rgba(239,68,68,0.22); border-color: rgba(239,68,68,0.55); color: #fca5a5; }
    .droplet-btn.active-amber .water-droplet { background: rgba(251,191,36,0.22); border-color: rgba(251,191,36,0.55); color: #fcd34d; }
    body.clean-ui .droplet-btn:not(.eye-btn), body.clean-ui .bottom-area { opacity: 0; pointer-events: none; }
    .bottom-area {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 28px 16px calc(env(safe-area-inset-bottom, 0px) + 52px); background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.45), transparent);
      transition: opacity 0.25s;
    }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-right: 44px; }
    .vid-title { font-size: 14px; font-weight: 600; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vid-time { font-size: 11px; color: #d4d4d8; flex-shrink: 0; }
    .meta-sub { font-size: 11px; color: #d4d4d8; margin-top: 2px; margin-bottom: 6px; padding-right: 44px; }
    .scrub-wrap { width: 100%; height: 26px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
    .scrub-track { width: 100%; height: 4px; background: rgba(255,255,255,0.28); border-radius: 4px; position: relative; }
    .scrub-fill { height: 100%; width: 0%; background: #ff2a5f; border-radius: 4px; position: relative; }
    .scrub-thumb { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; }
    .center-pill {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.78); padding: 10px 18px; border-radius: 14px;
      font-size: 18px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 35;
    }
    .center-pill.show { opacity: 1; }
    .seek-flash {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 35;
      background: rgba(0,0,0,0.7); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    .seek-flash.left { left: 20px; }
    .seek-flash.right { right: 56px; }
    .seek-flash.show { opacity: 1; }
    .modal-bg {
      position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,0.7);
      display: none; flex-direction: column; justify-content: flex-end;
    }
    .modal-bg.open { display: flex; }
    .sheet {
      background: #121218; border-top-left-radius: 24px; border-top-right-radius: 24px;
      max-height: 86dvh; display: flex; flex-direction: column; padding: 16px; border-top: 1px solid rgba(255,255,255,0.12);
    }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .tabs-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: rgba(0,0,0,0.45); border-radius: 12px; margin-top: 10px; }
    .tab-btn { min-height: 36px; border-radius: 9px; border: none; background: transparent; color: #a1a1aa; font-size: 12px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: #ff2a5f; color: #fff; }
    .sheet-body { flex: 1; overflow-y: auto; margin-top: 10px; }
    .settings-card { border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 10px; overflow: hidden; }
    .toggle-row {
      width: 100%; padding: 11px 14px; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.06);
      color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; text-align: left;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-title { font-size: 13px; font-weight: 600; }
    .toggle-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .switch-pill { width: 40px; height: 22px; border-radius: 999px; background: #3f3f46; padding: 2px; flex-shrink: 0; transition: background 0.2s; }
    .switch-pill.on { background: #ff2a5f; }
    .switch-pill.on-sky { background: #0ea5e9; }
    .switch-pill.on-em { background: #10b981; }
    .switch-knob { width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
    .switch-pill.on .switch-knob, .switch-pill.on-sky .switch-knob, .switch-pill.on-em .switch-knob { transform: translateX(18px); }
    .pill-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
    .filter-btn { padding: 6px 10px; border-radius: 8px; border: none; background: rgba(255,255,255,0.06); color: #a1a1aa; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #ff2a5f; color: #fff; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.04); margin-bottom: 6px; gap: 8px; }
    .item-info { flex: 1; min-width: 0; cursor: pointer; }
    .item-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 11px; color: #9ca3af; margin-top: 3px; }
    .dev-credit { font-size: 11px; color: #9ca3af; line-height: 1.55; text-align: center; padding: 12px; }
    .dev-credit strong { color: #f4f4f5; font-size: 12px; display: block; margin-top: 2px; }
    .fb-link {
      display: inline-block; margin-top: 6px; padding: 6px 14px; border-radius: 10px;
      background: rgba(59,130,246,0.16); border: 1px solid rgba(59,130,246,0.35);
      color: #60a5fa; text-decoration: none; font-size: 12px; font-weight: 600;
    }
    #unlock-pill {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 52px); left: 50%; transform: translateX(-50%); z-index: 60;
      display: none; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
      background: rgba(0,0,0,0.78); border: 1px solid rgba(255,255,255,0.25); color: #fff;
      font-size: 12px; font-weight: 600; backdrop-filter: blur(10px); cursor: pointer;
    }
    body.touch-locked #unlock-pill { display: flex; }
    body.touch-locked .right-rail, body.touch-locked .bottom-area { opacity: 0; pointer-events: none; }
    #toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 120;
      background: rgba(24,24,27,0.94); border: 1px solid rgba(255,255,255,0.15); color: #fff;
      padding: 8px 16px; border-radius: 12px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <input type="file" id="input-folder" webkitdirectory directory multiple style="display:none" />
  <input type="file" id="input-files" multiple accept="video/*,.mp4,.mkv,.webm,.mov,.avi,.3gp,.m4v,.flv,.wmv,.ts,.mts,.mpg,.mpeg,.ogv" style="display:none" />

  <div id="empty-player">
    <div class="logo-box">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#ff5c85"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <h1 id="t-empty-title">ভিডিও নির্বাচন করুন</h1>
    <p class="sub" id="t-empty-sub">ফাইল ম্যানেজার বা ফোল্ডার থেকে ভিডিও যোগ করুন অথবা সেটিংস খুলুন।</p>
    <button class="btn-primary" id="btn-files">ফাইল ম্যানেজার থেকে একসাথে সব ভিডিও</button>
    <button class="btn-secondary" id="btn-autoload" style="display:none; max-width:280px; margin-bottom:10px; border-color:rgba(16,185,129,0.45); background:rgba(16,185,129,0.18); color:#a7f3d0;">সংরক্ষিত ফোল্ডার থেকে অটো ভিডিও এড</button>
    <div class="row-2">
      <button class="btn-secondary" id="btn-folder">পুরো ফোল্ডার</button>
      <button class="btn-secondary" id="btn-open-settings">⚙ সেটিংস</button>
    </div>
    <div id="scan-status"></div>
  </div>

  <div id="feed"></div>

  <button id="unlock-pill" type="button">🔓 <span id="t-unlock">আনলক করুন</span></button>

  <div class="right-rail" id="right-rail">
    <button class="droplet-btn" id="act-folder" title="Add Videos"><span class="water-droplet">+</span></button>
    <button class="droplet-btn active-rose" id="act-sort" title="Auto-Rank"><span class="water-droplet">★</span></button>
    <button class="droplet-btn" id="act-timer" title="Sleep Timer"><span class="water-droplet">⏱</span></button>
    <button class="droplet-btn" id="act-like" title="Favorite"><span class="water-droplet">♥</span></button>
    <button class="droplet-btn" id="act-list" title="Playlist"><span class="water-droplet">☰</span></button>
    <button class="droplet-btn" id="act-settings" title="Settings"><span class="water-droplet">⚙</span></button>
    <button class="droplet-btn active-red" id="act-del" title="Delete (3x)"><span class="water-droplet">🗑</span></button>
    <button class="droplet-btn" id="act-lock" title="Touch Lock"><span class="water-droplet">🔒</span></button>
    <button class="droplet-btn eye-btn" id="act-eye" title="Clean UI"><span class="water-droplet">👁</span></button>
  </div>

  <div class="modal-bg" id="drawer">
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="t-drawer">সেটিংস ও তালিকা (<span id="list-count">0</span>)</h3>
        <button class="pill-btn" id="close-drawer">বন্ধ</button>
      </div>
      <div class="tabs-bar">
        <button class="tab-btn active" id="tab-settings">⚙ সেটিংস</button>
        <button class="tab-btn" id="tab-playlist">☰ তালিকা</button>
      </div>

      <div class="sheet-body" id="panel-settings">
        <div class="settings-card" style="padding:12px;">
          <div class="row-2" style="max-width:none;">
            <button class="pill-btn" id="drawer-add-files">+ Files</button>
            <button class="pill-btn" id="drawer-add-folder">+ Folder</button>
          </div>
          <button class="pill-btn" id="drawer-autoload" style="display:none; width:100%; margin-top:8px; background:rgba(16,185,129,0.2); color:#a7f3d0;">সংরক্ষিত ফোল্ডার লোড</button>
        </div>

        <div class="settings-card" style="padding:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;">
          <div style="display:flex; gap:6px;">
            <button class="pill-btn" id="lang-bn">বাংলা</button>
            <button class="pill-btn" id="lang-en">English</button>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="pill-btn" id="drawer-speed">1x</button>
            <button class="pill-btn" id="drawer-fit">Fit</button>
          </div>
        </div>

        <div class="settings-card">
          <button class="toggle-row" id="set-autosort">
            <div><div class="toggle-title" id="t-autosort">পছন্দের ভিডিও অটো সাজানো</div><div class="toggle-sub" id="t-autosort-sub">প্রিয় ও বেশি দেখা ভিডিও সামনে থাকবে</div></div>
            <div class="switch-pill on" id="pill-autosort"><div class="switch-knob"></div></div>
          </button>
          <button class="toggle-row" id="set-resume">
            <div><div class="toggle-title" id="t-resume">যেখান থেকে থেমেছিল সেখান থেকে চালু</div><div class="toggle-sub" id="t-resume-sub">শেষ দেখা সেকেন্ড থেকে ভিডিও চলবে</div></div>
            <div class="switch-pill on-em" id="pill-resume"><div class="switch-knob"></div></div>
          </button>
          <button class="toggle-row" id="set-timer">
            <div><div class="toggle-title" id="t-timer">অটো বন্ধের সময় (স্লিপ টাইমার)</div><div class="toggle-sub" id="t-timer-sub">ট্যাপ করে মিনিট সেট করুন</div></div>
            <span class="pill-btn" id="timer-badge">Off</span>
          </button>
        </div>

        <div class="settings-card dev-credit">
          Developed &amp; Maintained by
          <strong>Kibrea Digital Studio</strong>
          Mobile Servicing &amp; Tech Solutions · Moshang Bazar, Uzirpur, Barishal<br/>
          <a class="fb-link" href="https://www.facebook.com/share/1MpouoXEeN/" target="_blank" rel="noopener noreferrer">Facebook Page</a>
        </div>
      </div>

      <div class="sheet-body" id="panel-playlist" style="display:none;">
        <div class="filter-bar">
          <button class="filter-btn active" data-dur="all" id="f-all">সব</button>
          <button class="filter-btn" data-dur="short" id="f-short">ছোট (&lt;৭মি)</button>
          <button class="filter-btn" data-dur="long" id="f-long">বড় (৭মি+)</button>
          <button class="pill-btn" id="btn-clear-list" style="margin-left:auto;background:rgba(239,68,68,0.16);color:#fca5a5;">সব সরান</button>
        </div>
        <div id="list-items"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const VIDEO_EXTS = ['mp4','mkv','webm','mov','avi','3gp','m4v','flv','wmv','ts','mts','m2ts','mpg','mpeg','ogv','vob'];
    const STORAGE_KEY = 'smart_vp_data_v3';
    const SETTINGS_KEY = 'smart_vp_settings_v1';
    function safeGetStorage(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
    function safeSetStorage(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    let savedData = {};
    try { savedData = JSON.parse(safeGetStorage(STORAGE_KEY) || '{}'); } catch(e) { savedData = {}; }
    let settings = { language: 'bn', autoSort: true, autoResume: true, playbackRate: 1, aspectFit: 'contain' };
    try { settings = Object.assign(settings, JSON.parse(safeGetStorage(SETTINGS_KEY) || '{}')); } catch(e) {}
    let allVideos = [];
    let videos = [];
    let durFilter = 'all';
    let currentIndex = 0;
    let touchLocked = false;
    let sleepSecs = null;
    let sleepTimerId = null;
    let dimTimer = null;
    let pendingAutoHandles = [];
    let pausedByUser = false;
    let lastPosSec = -1;
    let thumbMap = {};
    let artworkDataUrl = '';
    try {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const cx = cv.getContext('2d');
      if (cx) {
        cx.fillStyle = '#09090b';
        cx.fillRect(0, 0, 256, 256);
        const grd = cx.createLinearGradient(0, 0, 256, 256);
        grd.addColorStop(0, '#ff2a5f');
        grd.addColorStop(1, '#38bdf8');
        cx.fillStyle = grd;
        cx.fillRect(28, 28, 200, 200);
        cx.fillStyle = '#ffffff';
        cx.beginPath(); cx.moveTo(98, 76); cx.lineTo(176, 128); cx.lineTo(98, 180); cx.closePath(); cx.fill();
        artworkDataUrl = cv.toDataURL('image/png');
      }
    } catch(e) {}
    const rail = document.getElementById('right-rail');
    const SHORT_MAX_SEC = 420;
    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];

    const STRINGS = {
      bn: {
        emptyTitle: 'ভিডিও নির্বাচন করুন',
        emptySub: 'ফাইল ম্যানেজার বা ফোল্ডার থেকে ভিডিও যোগ করুন অথবা সেটিংস খুলুন।',
        btnFiles: 'ফাইল ম্যানেজার থেকে একসাথে সব ভিডিও',
        btnFolder: 'পুরো ফোল্ডার',
        btnAutoload: 'সংরক্ষিত ফোল্ডার থেকে অটো ভিডিও এড',
        openSettings: '⚙ সেটিংস',
        tabSettings: '⚙ সেটিংস',
        tabPlaylist: '☰ তালিকা',
        autoSort: 'পছন্দের ভিডিও অটো সাজানো',

    function isVideoFile(f) {
      if (!f || !f.name) return false;

    function canUseDirPicker() {
      if (!('showDirectoryPicker' in window)) return false;
      try { if (window.self !== window.top) return false; } catch(e) { return false; }
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;
      return window.isSecureContext === true;
    }
    function canUseWebkitDir(el) {
      if (!el || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;

    function getRating(d) {
      if (!d) return '0.0';
      const w = Math.min(2.6, ((d.watchSeconds||0)/120)*2.6);
      const s = Math.min(0.9, ((d.score||0)/30)*0.9);
      const v = Math.min(0.5, (d.views||0)*0.25);
      const l = d.liked ? 1.2 : 0;
      return Math.min(5, w+s+v+l).toFixed(1);
    }

    function openHandleDb() {
      return new Promise((res, rej) => {
        if (typeof indexedDB === 'undefined') return rej();
        const r = indexedDB.open('smart_vp_handles_v1', 2);
        r.onupgradeneeded = () => {
          if (!r.result.objectStoreNames.contains('dir_handles')) r.result.createObjectStore('dir_handles');
          if (!r.result.objectStoreNames.contains('video_files')) r.result.createObjectStore('video_files', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej();
      });
    }
    async function saveDirHandle(h) {
      try {
        const db = await openHandleDb();
        await new Promise((res) => { const tx = db.transaction('dir_handles', 'readwrite'); tx.objectStore('dir_handles').put(h, h.name); tx.oncomplete = res; tx.onerror = res; });
        db.close();
      } catch(e) {}
    }
    async function loadDirHandles() {
      try {
        const db = await openHandleDb();
        const list = await new Promise((res) => { const tx = db.transaction('dir_handles', 'readonly'); const rq = tx.objectStore('dir_handles').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); });
        db.close();
        return list;
      } catch(e) { return []; }
    }
    async function saveFilesToIdb(items) {
      try {
        const db = await openHandleDb();
        for (const it of items) {
          if (it.file.size > 250*1024*1024) continue;
          await new Promise((res) => { const tx = db.transaction('video_files', 'readwrite'); tx.objectStore('video_files').put({ key: it.key, file: it.file, folder: it.folder }); tx.oncomplete = res; tx.onerror = res; });
        }
        db.close();
      } catch(e) {}
    }
    async function loadFilesFromIdb() {
      try {
        const db = await openHandleDb();
        const list = await new Promise((res) => { const tx = db.transaction('video_files', 'readonly'); const rq = tx.objectStore('video_files').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); });
        db.close();
        return list.map(r => { if (r && r.file) { r.file.customFolder = r.folder; return r.file; } return null; }).filter(Boolean);
      } catch(e) { return []; }
    }
    async function deleteFileFromIdb(key) {
      try {
        const db = await openHandleDb();
        await new Promise((res) => { const tx = db.transaction('video_files', 'readwrite'); tx.objectStore('video_files').delete(key); tx.oncomplete = res; tx.onerror = res; });
        db.close();
      } catch(e) {}
    }
    async function clearFilesFromIdb() {
      try {
        const db = await openHandleDb();
        await new Promise((res) => { const tx = db.transaction('video_files', 'readwrite'); tx.objectStore('video_files').clear(); tx.oncomplete = res; tx.onerror = res; });
        db.close();
      } catch(e) {}
    }
    async function scanDirHandle(h, p, out) {
      try {
        for await (const e of h.values()) {
          if (e.kind === 'file' && VIDEO_EXTS.includes(e.name.split('.').pop().toLowerCase().trim())) {
            try { const f = await e.getFile(); f.customFolder = p; out.push(f); } catch(err) {}
          } else if (e.kind === 'directory') await scanDirHandle(e, p + '/' + e.name, out);
        }
      } catch(err) {}
    }

      const folderInput = document.getElementById('input-folder');

      } catch (err) {
        if (err && err.name === 'AbortError') return;
        filesInput.click();
      }
    }

        try {

          if (p === 'granted') granted.push(h);
          else if (p === 'prompt') pendingAutoHandles.push(h);

      }
      if (pendingAutoHandles.length) {

        document.getElementById('drawer-autoload').style.display = 'block';

    function loadFiles(list, isRestore) {
      const seen = new Set(allVideos.map(v => v.key));
      const newItems = [];
      list.forEach(f => {
        const key = f.name + '_' + f.size;
        if (seen.has(key)) return;
        seen.add(key);
        if (!savedData[key]) savedData[key] = { score: 0, liked: false, pos: 0, watchSeconds: 0, views: 0 };
        const it = { key, file: f, name: f.name.replace(/\.[^/.]+$/, ''), folder: f.customFolder || 'Storage', duration: savedData[key].duration || 0, url: null };
        allVideos.push(it);
        newItems.push(it);
      });
      if (!newItems.length) { if (!isRestore) toast('No new videos'); return; }
      savePrefs();
      if (!isRestore) saveFilesToIdb(newItems);
      probeDurations();
      applyFilterAndSort();
      document.getElementById('empty-player').style.display = 'none';
      document.getElementById('drawer').classList.remove('open');
      wakeRail();
    }

    async function probeDurations() {
      for (const v of allVideos) {
        if (v.duration > 0) continue;
        await new Promise(res => {
          const u = URL.createObjectURL(v.file);
          const el = document.createElement('video');
          el.preload = 'metadata'; el.src = u;
          el.onloadedmetadata = () => { v.duration = el.duration || 0; savedData[v.key].duration = v.duration; savePrefs(); URL.revokeObjectURL(u); res(); };
          el.onerror = () => { URL.revokeObjectURL(u); res(); };
        });
      }
    }

    function applyFilterAndSort() {
      videos = allVideos.filter(v => {
        if (durFilter === 'short') return v.duration > 0 && v.duration < SHORT_MAX_SEC;
        if (durFilter === 'long') return v.duration >= SHORT_MAX_SEC;
        return true;
      });
      if (settings.autoSort) {
        videos.sort((a, b) => {
          const da = savedData[a.key] || {}, db = savedData[b.key] || {};
          return ((db.score||0)+(db.liked?50:0)) - ((da.score||0)+(da.liked?50:0));
        });
      }
      document.getElementById('list-count').textContent = allVideos.length;
      renderFeed();
    }

    function handleVideoFinish(idx) {
      const v = videos[idx];
      if (v) { savedData[v.key].pos = 0; savePrefs(); }
      if (videos.length <= 1) {
        const vid = document.querySelectorAll('.slide')[idx]?.querySelector('video');
        if (vid) { vid.currentTime = 0; vid.play().catch(()=>{}); }
        return;
      }
      if (idx < videos.length - 1) {
        document.querySelectorAll('.slide')[idx + 1]?.scrollIntoView({ behavior: 'smooth' });
      } else {
        settings.autoSort = true; saveSets(); updateSettingUI();
        applyFilterAndSort();
        document.querySelectorAll('.slide')[0]?.scrollIntoView({ behavior: 'smooth' });
        toast((STRINGS[settings.language] || STRINGS.bn).loopFav);
      }
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      const L = STRINGS[settings.language] || STRINGS.bn;
      videos.forEach((v, idx) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.dataset.index = idx;
        slide.innerHTML = '<video playsinline preload="metadata"></video><div class="center-pill mono">00:00 / 00:00</div><div class="seek-flash left">« 10s</div><div class="seek-flash right">10s »</div><div class="bottom-area"><div class="title-row"><div class="vid-title"></div><div class="vid-time mono">00:00 / 00:00</div></div><div class="meta-sub mono">' + L.watched + ' ' + fmt(savedData[v.key]?.watchSeconds) + ' · ★ ' + getRating(savedData[v.key]) + '</div><div class="scrub-wrap"><div class="scrub-track"><div class="scrub-fill"><div class="scrub-thumb"></div></div></div></div></div>';
        slide.querySelector('.vid-title').textContent = v.name;
        setupSlide(slide, v, idx);
        feed.appendChild(slide);
      });
      setupObserver();
    }

    function setupSlide(slide, v, idx) {
      const vid = slide.querySelector('video');
      vid.playbackRate = settings.playbackRate || 1;
      const fill = slide.querySelector('.scrub-fill');
      const timeTxt = slide.querySelector('.vid-time');
      const metaTxt = slide.querySelector('.meta-sub');
      const centerPill = slide.querySelector('.center-pill');
      const flashL = slide.querySelector('.seek-flash.left');
      const flashR = slide.querySelector('.seek-flash.right');
      let lastTap = 0, tapT = null, holdT = null, isHoldScrub = false, startX = 0, startTime = 0, moved = false;

      vid.addEventListener('touchstart', (e) => {
        if (touchLocked) return;
        wakeRail();
        startX = e.touches[0].clientX;
        startTime = vid.currentTime || 0;
        moved = false;
        holdT = setTimeout(() => {
          isHoldScrub = true;
          document.getElementById('feed').classList.add('lock-scroll');
          centerPill.classList.add('show');
        }, 260);
      }, { passive: true });

      vid.addEventListener('touchmove', (e) => {
        if (touchLocked) return;
        const dx = e.touches[0].clientX - startX;
        if (Math.abs(dx) > 12) moved = true;
        if (!isHoldScrub) { if (Math.abs(dx) < 10) return; clearTimeout(holdT); return; }
        if (!vid.duration) return;
        const delta = (dx / window.innerWidth) * Math.min(120, Math.max(40, vid.duration * 0.4));
        const target = Math.max(0, Math.min(vid.duration, startTime + delta));
        vid.currentTime = target;
        centerPill.textContent = fmt(target) + ' / ' + fmt(vid.duration);
      }, { passive: true });

      vid.addEventListener('touchend', () => {
        clearTimeout(holdT);
        if (isHoldScrub) {
          isHoldScrub = false;
          if (!touchLocked) document.getElementById('feed').classList.remove('lock-scroll');
          centerPill.classList.remove('show');
        }
      });

      vid.onclick = (e) => {
        if (touchLocked || moved) return;
        wakeRail();
        const now = Date.now();
        const xRatio = e.clientX / window.innerWidth;
        if (now - lastTap < 280) {
          clearTimeout(tapT);
          if (xRatio < 0.35) {
            vid.currentTime = Math.max(0, vid.currentTime - 10);
            flashL.classList.add('show'); setTimeout(() => flashL.classList.remove('show'), 600);
          } else if (xRatio > 0.65) {
            vid.currentTime = Math.min(vid.duration || 99999, vid.currentTime + 10);
            flashR.classList.add('show'); setTimeout(() => flashR.classList.remove('show'), 600);
          } else {
            savedData[v.key].liked = !savedData[v.key].liked;
            if (savedData[v.key].liked) savedData[v.key].score += 15;
            savePrefs(); toast('♥');
          }
        } else {
          tapT = setTimeout(() => {
            if (vid.paused) { pausedByUser = false; vid.play().catch(()=>{}); }
            else { pausedByUser = true; vid.pause(); }
          }, 280);
        }
        lastTap = now;
      };

      const captureThumb = () => {
        if (thumbMap[v.key] || vid.videoWidth <= 0 || vid.videoHeight <= 0) return;
        try {
          const sz = 256, cv = document.createElement('canvas');
          cv.width = sz; cv.height = sz;
          const cx = cv.getContext('2d');
          if (!cx) return;
          cx.fillStyle = '#09090b'; cx.fillRect(0, 0, sz, sz);
          const r = Math.min(sz / vid.videoWidth, sz / vid.videoHeight);
          const dw = vid.videoWidth * r, dh = vid.videoHeight * r;
          cx.drawImage(vid, (sz - dw) / 2, (sz - dh) / 2, dw, dh);
          const dUrl = cv.toDataURL('image/jpeg', 0.82);
          if (dUrl && dUrl.length > 64) {
            thumbMap[v.key] = dUrl;
            if (idx === currentIndex) updateMediaMetadata();
          }
        } catch(e) {}
      };

      vid.onloadeddata = captureThumb;

      vid.onplay = () => {
        if (idx !== currentIndex) {
          vid.muted = true;
          if (!vid.paused) vid.pause();
          return;
        }
        pausedByUser = false;
        captureThumb();
        updateMediaMetadata();
        bindMediaSessionHandlers();
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        syncMediaPosition(vid);
      };

      vid.onpause = () => {
        if (idx !== currentIndex) return;
        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = 'paused';
        }
      };

      vid.ontimeupdate = () => {
        if (!vid.duration) return;
        fill.style.width = (vid.currentTime / vid.duration * 100) + '%';
        timeTxt.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
        const sec = Math.floor(vid.currentTime);
        if (idx === currentIndex && sec !== lastPosSec) {
          lastPosSec = sec;
          syncMediaPosition(vid);
        }
        if (sec % 2 === 0) {
          savedData[v.key].pos = vid.duration - vid.currentTime < 2 ? 0 : vid.currentTime;
          savedData[v.key].watchSeconds = (savedData[v.key].watchSeconds || 0) + 0.5;
          const L = STRINGS[settings.language] || STRINGS.bn;
          if (!savedData[v.key].liked && (savedData[v.key].watchSeconds >= 30 || vid.currentTime / vid.duration > 0.75)) {
            savedData[v.key].liked = true;
            savedData[v.key].score += 15;
            toast(L.autoLiked);
          }
          savePrefs();
          metaTxt.textContent = L.watched + ' ' + fmt(savedData[v.key].watchSeconds) + ' · ★ ' + getRating(savedData[v.key]);
        }
      };

      vid.onended = () => {
        if (idx === currentIndex) handleVideoFinish(idx);
      };

      const scrub = slide.querySelector('.scrub-wrap');
      const seekAt = (cx) => {
        if (touchLocked || !vid.duration) return;
        const r = scrub.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (cx - r.left) / r.width));
        vid.currentTime = ratio * vid.duration;
      };
      scrub.addEventListener('touchstart', (e) => { if (touchLocked) return; e.stopPropagation(); seekAt(e.touches[0].clientX); }, { passive: true });
      scrub.addEventListener('touchmove', (e) => { if (touchLocked) return; e.stopPropagation(); seekAt(e.touches[0].clientX); }, { passive: true });
      scrub.addEventListener('mousedown', (e) => { seekAt(e.clientX); });
    }

    function setupObserver() {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(ent => {
          const idx = Number(ent.target.dataset.index);
          const v = videos[idx]; if (!v) return;
          const vid = ent.target.querySelector('video');
          if (ent.isIntersecting) {
            currentIndex = idx;
            pausedByUser = false;
            if (!v.url) v.url = URL.createObjectURL(v.file);
            if (vid.src !== v.url) {
              vid.src = v.url;
              vid.onloadedmetadata = () => {
                if (settings.autoResume && savedData[v.key]?.pos > 2 && savedData[v.key].pos < vid.duration - 2) {
                  vid.currentTime = savedData[v.key].pos;
                }
              };
            }
            updateMediaMetadata();
            vid.muted = false;
            vid.playbackRate = settings.playbackRate || 1;
            vid.play().catch(() => {});
          } else {
            if (!vid.paused) vid.pause();
          }
        });
      }, { threshold: 0.65 });
      document.querySelectorAll('.slide').forEach(s => obs.observe(s));
    }

    document.getElementById('act-sort').onclick = () => { settings.autoSort = !settings.autoSort; saveSets(); updateSettingUI(); if (allVideos.length) applyFilterAndSort(); };
    document.getElementById('act-like').onclick = () => { const v = videos[currentIndex]; if (!v) return; savedData[v.key].liked = !savedData[v.key].liked; if (savedData[v.key].liked) savedData[v.key].score += 15; savePrefs(); toast('♥'); };
    document.getElementById('act-lock').onclick = () => {
      touchLocked = true;
      document.body.classList.add('touch-locked');
      document.getElementById('feed').classList.add('lock-scroll');
      toast((STRINGS[settings.language] || STRINGS.bn).lockedMsg);
    };
    document.getElementById('unlock-pill').onclick = () => {
      touchLocked = false;
      document.body.classList.remove('touch-locked');
      document.getElementById('feed').classList.remove('lock-scroll');
      toast((STRINGS[settings.language] || STRINGS.bn).unlockedMsg);
    };
    document.getElementById('act-eye').onclick = () => document.body.classList.toggle('clean-ui');

    let delTapCount = 0, delTapTimer = null;
    document.getElementById('act-del').onclick = () => {
      const v = videos[currentIndex]; if (!v) return;
      delTapCount++;
      clearTimeout(delTapTimer);
      if (delTapCount < 3) {
        toast((3 - delTapCount) + 'x');
        delTapTimer = setTimeout(() => { delTapCount = 0; }, 900);
        return;
      }
      delTapCount = 0;
      if (v.url) URL.revokeObjectURL(v.url);
      delete savedData[v.key]; savePrefs();
      allVideos = allVideos.filter(x => x.key !== v.key);
      if (allVideos.length === 0) {
        videos = []; document.getElementById('feed').innerHTML = '';
        document.getElementById('empty-player').style.display = 'flex';
        document.getElementById('list-count').textContent = '0';
      } else { applyFilterAndSort(); }
    };

    const timerPresets = [0, 10, 15, 30, 45, 60];
    let timerPresetIdx = 0;
    function cycleSleepTimer() {
      timerPresetIdx = (timerPresetIdx + 1) % timerPresets.length;
      const mins = timerPresets[timerPresetIdx];
      clearInterval(sleepTimerId);
      if (mins === 0) {
        sleepSecs = null;
        document.getElementById('act-timer').className = 'droplet-btn';
        document.getElementById('timer-badge').textContent = 'Off';
        return;
      }
      sleepSecs = mins * 60;
      document.getElementById('act-timer').className = 'droplet-btn active-amber';
      document.getElementById('timer-badge').textContent = mins + 'm';
      toast(mins + ' min');
      sleepTimerId = setInterval(() => {
        sleepSecs--;
        if (sleepSecs <= 0) {
          clearInterval(sleepTimerId); sleepSecs = null; timerPresetIdx = 0;
          document.querySelectorAll('video').forEach(v => v.pause());
          document.getElementById('act-timer').className = 'droplet-btn';
          document.getElementById('timer-badge').textContent = 'Off';
        }
      }, 1000);
    }
    document.getElementById('act-timer').onclick = cycleSleepTimer;
    document.getElementById('set-timer').onclick = cycleSleepTimer;

    function updateMediaMetadata() {
      if (!('mediaSession' in navigator)) return;
      const v = videos[currentIndex];
      if (!v) return;
      try {
        const art = [];
        if (thumbMap[v.key]) art.push({ src: thumbMap[v.key], sizes: '256x256', type: 'image/jpeg' });
        if (artworkDataUrl) art.push({ src: artworkDataUrl, sizes: '256x256', type: 'image/png' });
        navigator.mediaSession.metadata = new MediaMetadata({
          title: v.name,
          artist: v.folder || 'Smart Video Player',
          album: 'Smart Video Player',
          artwork: art
        });
      } catch(e) {}
    }

    function syncMediaPosition(el) {
      if (!el || !el.duration || isNaN(el.duration)) return;
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        try {
          navigator.mediaSession.setPositionState({
            duration: el.duration,
            playbackRate: el.playbackRate || 1,
            position: Math.max(0, Math.min(el.currentTime || 0, el.duration))
          });
        } catch(e) {}
      }
    }

    function bindMediaSessionHandlers() {
      if (!('mediaSession' in navigator)) return;
      const handlers = [
        ['play', () => {
          pausedByUser = false;
          const vid = document.querySelectorAll('.slide')[currentIndex]?.querySelector('video');
          if (vid) { vid.muted = false; vid.play().then(() => { navigator.mediaSession.playbackState = 'playing'; syncMediaPosition(vid); }).catch(() => {}); }
        }],
        ['pause', () => {
          pausedByUser = true;
          const vid = document.querySelectorAll('.slide')[currentIndex]?.querySelector('video');
          if (vid) vid.pause();
          navigator.mediaSession.playbackState = 'paused';
        }],
        ['previoustrack', () => switchTrackHtml(currentIndex - 1)],
        ['nexttrack', () => switchTrackHtml(currentIndex + 1)],
        ['seekto', (d) => {
          if (d.seekTime === undefined) return;
          const vid = document.querySelectorAll('.slide')[currentIndex]?.querySelector('video');
          if (vid) { vid.currentTime = d.seekTime; syncMediaPosition(vid); }
        }]
      ];
      handlers.forEach(([act, fn]) => { try { navigator.mediaSession.setActionHandler(act, fn); } catch(e) {} });
    }
    bindMediaSessionHandlers();

    function switchTrackHtml(targetIdx) {
      if (!videos.length) return;
      const clamped = ((targetIdx % videos.length) + videos.length) % videos.length;
      const v = videos[clamped];
      if (!v) return;
      currentIndex = clamped;
      pausedByUser = false;
      if (!v.url) v.url = URL.createObjectURL(v.file);
      document.querySelectorAll('.slide')[clamped]?.scrollIntoView({ behavior: document.hidden ? 'auto' : 'smooth' });
      updateMediaMetadata();
      const vid = document.querySelectorAll('.slide')[clamped]?.querySelector('video');
      if (vid) {
        if (vid.src !== v.url) vid.src = v.url;
        vid.muted = false;
        vid.playbackRate = settings.playbackRate || 1;
        vid.play().catch(() => {});
      }
    }

    function removeVideoFromPlaylist(key) {
      const target = allVideos.find(x => x.key === key);
      if (target && target.url) URL.revokeObjectURL(target.url);
      deleteFileFromIdb(key);
      allVideos = allVideos.filter(x => x.key !== key);
      if (allVideos.length === 0) {
        videos = [];
        document.getElementById('feed').innerHTML = '';
        document.getElementById('empty-player').style.display = 'flex';
        document.getElementById('list-count').textContent = '0';
      } else {
        applyFilterAndSort();
      }
      renderPlaylistItems();
      toast((STRINGS[settings.language] || STRINGS.bn).removedMsg);
    }

    document.getElementById('btn-clear-list').onclick = () => {
      if (!allVideos.length) return;
      allVideos.forEach(v => { if (v.url) URL.revokeObjectURL(v.url); });
      clearFilesFromIdb();
      allVideos = [];
      videos = [];
      document.getElementById('feed').innerHTML = '';
      document.getElementById('empty-player').style.display = 'flex';
      document.getElementById('list-count').textContent = '0';
      document.getElementById('drawer').classList.remove('open');
      toast((STRINGS[settings.language] || STRINGS.bn).clearedMsg);
    };

    function renderPlaylistItems() {
      const box = document.getElementById('list-items'); box.innerHTML = '';
      document.getElementById('list-count').textContent = allVideos.length;
      videos.forEach((v, idx) => {
        const d = savedData[v.key] || {};
        const el = document.createElement('div'); el.className = 'list-item';
        const info = document.createElement('div'); info.className = 'item-info';
        info.innerHTML = '<div class="item-name">' + (d.liked?'❤️ ':'') + v.name + '</div><div class="item-meta mono">★ ' + getRating(d) + ' · ' + fmt(d.watchSeconds) + '</div>';
        info.onclick = () => { document.getElementById('drawer').classList.remove('open'); document.querySelectorAll('.slide')[idx]?.scrollIntoView(); };
        const rmBtn = document.createElement('button');
        rmBtn.className = 'pill-btn';
        rmBtn.style.cssText = 'padding:6px 10px;background:rgba(255,255,255,0.1);flex-shrink:0;';
        rmBtn.textContent = '✕';
        rmBtn.onclick = (e) => { e.stopPropagation(); removeVideoFromPlaylist(v.key); };
        el.appendChild(info);
        el.appendChild(rmBtn);
        box.appendChild(el);
      });
    }

    document.getElementById('act-list').onclick = () => {
      switchDrawerTab('playlist');
      document.getElementById('drawer').classList.add('open');
    };
    document.getElementById('act-settings').onclick = () => {
      switchDrawerTab('settings');
      document.getElementById('drawer').classList.add('open');
    };
    document.getElementById('close-drawer').onclick = () => document.getElementById('drawer').classList.remove('open');
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        durFilter = btn.dataset.dur;
        applyFilterAndSort();
        renderPlaylistItems();
      };
    });
  </script>
</body>
</html>
